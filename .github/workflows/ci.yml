name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full-suite run against the demo stand keeps it verified every day.
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collection-check:
    name: Structure check (--list)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure all specs are parseable and collect
        run: |
          npx playwright test --list --reporter=line
          npx playwright test --config=playwright.prod.config.js --list --reporter=line

  demo:
    name: Self-contained demo run (fast signal on push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run demo suite
        run: npx playwright test tests/demo --reporter=github,html
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-demo
          path: playwright-report/
          retention-days: 14

  # Full suite against the demo stand. Triggered manually with the
  # "Run workflow" button (e.g. by HR reviewing the portfolio) or by the
  # nightly schedule — NOT on every push.
  demo-suite:
    name: Full suite on demo.alenaproyoga.ru
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: collection-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: https://demo.alenaproyoga.ru/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reset the demo database (in-app test endpoint)
        run: |
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            "${BASE_URL}api/demo/reset-db/")
          code=$(printf '%s' "$resp" | tail -n 1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "reset status: $code"
          echo "$body"
          test "$code" = "200"
      - name: Run the full suite
        run: npx playwright test --reporter=github,html
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-demo-suite
          path: playwright-report/
          retention-days: 30